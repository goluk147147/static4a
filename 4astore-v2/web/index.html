<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0FA958" />
    <!-- Favicons: favicon.ico is a REAL multi-size ICO (16/32/48px) — the path Google and browsers
         probe by default. favicon.png is the same 4A logo at 96x96 (a multiple of 48, which Google
         requires for search-result favicons). Declared sizes match the real pixel size so Google
         won't ignore the icon. Both files live in web/public/ and ship to the site root. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="96x96" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="description" content="4A Store - Online kirana & grocery store in Chandargarh, Nabinagar (Aurangabad, Bihar - 824301). Fresh fruits, vegetables, daily essentials & general store saman — fast local home delivery." />
    <title>4A Store | Online Kirana &amp; Grocery Delivery in Chandargarh, Nabinagar</title>
    <link rel="canonical" href="https://4astore.com/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="4A Store" />
    <meta property="og:title" content="4A Store | Online Kirana &amp; Grocery Delivery in Chandargarh, Nabinagar" />
    <meta property="og:description" content="Online kirana & grocery store in Chandargarh, Nabinagar (Aurangabad, Bihar - 824301). Fresh fruits, vegetables & daily essentials — fast local home delivery." />
    <meta property="og:url" content="https://4astore.com/" />
    <!-- Static LocalBusiness JSON-LD in the raw HTML so crawlers get structured data even before the
         SPA's client-side Helmet runs. The app still emits richer per-page JSON-LD on top. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "GroceryStore",
      "name": "4A Store",
      "url": "https://4astore.com/",
      "image": "https://4astore.com/notification-logo.png",
      "priceRange": "₹",
      "openingHours": "Mo-Su 07:00-21:00",
      "telephone": "+91-7543888698",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Chandargarh, Nabinagar",
        "addressLocality": "Nabinagar",
        "addressRegion": "Bihar",
        "postalCode": "824301",
        "addressCountry": "IN"
      },
      "areaServed": [
        { "@type": "Place", "name": "Chandargarh" },
        { "@type": "Place", "name": "Nabinagar" },
        { "@type": "Place", "name": "Aurangabad" }
      ]
    }
    </script>
    <!-- WebSite JSON-LD with a sitelinks searchbox SearchAction. Target resolves to the SPA's real
         search route (/products?search=…), so Google's searchbox leads to a working results page. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "4A Store",
      "url": "https://4astore.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://4astore.com/products?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <!-- Original 4AStore stylesheet (exact look) -->
    <link rel="stylesheet" href="/legacy/css/style.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Crawl / no-JS fallback: real text + internal links so the homepage is never an empty shell
         to a crawler that doesn't run JavaScript. The SPA replaces #root on load; this stays only
         for no-JS agents. -->
    <noscript>
      <main style="max-width:720px;margin:0 auto;padding:24px;font-family:system-ui,Arial,sans-serif">
        <h1>4A Store — Online Grocery Delivery in Chandargarh</h1>
        <p>4A Store aapka local kirana store hai. Fresh fruits, vegetables aur daily essentials ki
          fast home delivery Chandargarh, Nabinagar aur aas-paas (PIN 824301), Aurangabad, Bihar me.</p>
        <p>Ye ek online grocery store hai jahan se aap kirana store online, general store ka saman,
          aur daily essentials ghar baithe order kar sakte hain. Fruits &amp; vegetables delivery,
          atta, dal, oil aur ghee — sab kuchh best price par, Chandargarh, Nabinagar aur Aurangabad,
          Bihar me fast local home delivery ke saath.</p>
        <nav>
          <ul>
            <li><a href="/products">Browse all products</a></li>
            <li><a href="/products?search=fruits">Fresh fruits &amp; vegetables</a></li>
            <li><a href="/products?search=atta">Atta, dal &amp; oil</a></li>
            <li><a href="/products?search=snacks">Daily essentials &amp; snacks</a></li>
            <li><a href="/page/help-support">Help &amp; Support</a></li>
            <li><a href="/page/privacy-policy">Privacy Policy</a></li>
            <li><a href="/page/terms">Terms &amp; Conditions</a></li>
          </ul>
        </nav>
        <p>Order karne ke liye app ya website kholें — delivery sirf PIN 824301 me uplabdh hai.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
