# =============================================================================
# 4A Store — social-crawler OG routing (UNIVERSAL / deploy-safe)
#
# WHY THIS FILE EXISTS (and not .htaccess):
#   The public paths /product/:id , /page/:slug , /category/:slug , /products?category=…
#   are served by the SPA (Apache DocumentRoot). Social crawlers that fetch those public
#   URLs must instead receive the per-entity OpenGraph HTML (correct og:title / og:description
#   / og:image) so WhatsApp / Facebook / etc. render a rich preview.
#
#   The old mechanism lived in web/public/.htaccess, which is FRAGILE:
#     - deploy.sh rsync EXCLUDES .htaccess, so it never ships automatically
#     - it was manually reverted on the server
#     - Apache + Cloudflare make per-request .htaccess rewrites brittle
#
#   This file is tracked in the repo and INSTALLED BY deploy.sh (sudo cp into the Apache
#   conf.d / vhost include dir). It survives every deploy. It proxies ONLY known crawler
#   user-agents to the Node OG endpoint; humans fall through to the SPA untouched.
#
# PREREQUISITES (already true on the box): mod_rewrite, mod_proxy, mod_proxy_http, mod_headers.
# /api is already reverse-proxied to the Node app, so /api/og-crawl is reachable.
#
# ONE-TIME install (deploy.sh does this automatically; manual form shown for reference):
#   sudo cp 4astore-v2/deploy/4astore-og.conf /etc/httpd/conf.d/4astore-og.conf   # Amazon Linux / RHEL
#   # (Debian/Ubuntu: /etc/apache2/conf-available + a2enconf 4astore-og)
#   sudo systemctl reload httpd   # or: apachectl graceful
#
# After the first install this file is picked up on every deploy via deploy.sh.
# =============================================================================

<IfModule mod_rewrite.c>
  RewriteEngine On

  # Universal short-links: 4astore.com/link/<code> → Node for ALL user-agents
  # (NOT crawler-UA-gated). The Node route (GET /api/link/:code, routes/link.ts)
  # itself branches: crawler UA → OG HTML, human UA → smart-redirect page. This
  # MUST stay in sync with the app.use('/api/link', …) mount in server.ts.
  RewriteRule ^/?link/([A-Za-z0-9]+)/?$ http://127.0.0.1:4000/api/link/$1 [P,L]

  # Crawler user-agents (case-insensitive). Keep in sync with middleware/ogCrawler.ts.
  # The whole original request URI (path + query) is forwarded to the Node OG endpoint as
  # ?path=… so the handler can rebuild the exact OG HTML. [P] = reverse-proxy, [QSD] drops the
  # incoming query so only our encoded ?path survives, [L] = last rule.

  # /product/:id
  RewriteCond %{HTTP_USER_AGENT} (facebookexternalhit|Facebot|WhatsApp|Twitterbot|Slackbot|Slack-ImgProxy|LinkedInBot|Discordbot|TelegramBot|Pinterest|redditbot|Googlebot|bingbot|Embedly|SkypeUriPreview|vkShare|W3C_Validator) [NC]
  RewriteRule ^/?product/([A-Za-z0-9]+)/?$ http://127.0.0.1:4000/api/og-crawl?path=/product/$1 [P,QSD,L]

  # /page/:slug
  RewriteCond %{HTTP_USER_AGENT} (facebookexternalhit|Facebot|WhatsApp|Twitterbot|Slackbot|Slack-ImgProxy|LinkedInBot|Discordbot|TelegramBot|Pinterest|redditbot|Googlebot|bingbot|Embedly|SkypeUriPreview|vkShare|W3C_Validator) [NC]
  RewriteRule ^/?page/([A-Za-z0-9-]+)/?$ http://127.0.0.1:4000/api/og-crawl?path=/page/$1 [P,QSD,L]

  # /category/:slug
  RewriteCond %{HTTP_USER_AGENT} (facebookexternalhit|Facebot|WhatsApp|Twitterbot|Slackbot|Slack-ImgProxy|LinkedInBot|Discordbot|TelegramBot|Pinterest|redditbot|Googlebot|bingbot|Embedly|SkypeUriPreview|vkShare|W3C_Validator) [NC]
  RewriteRule ^/?category/([A-Za-z0-9-]+)/?$ http://127.0.0.1:4000/api/og-crawl?path=/category/$1 [P,QSD,L]

  # /products?category=slug  (category listing) — forward the category to the OG endpoint.
  RewriteCond %{HTTP_USER_AGENT} (facebookexternalhit|Facebot|WhatsApp|Twitterbot|Slackbot|Slack-ImgProxy|LinkedInBot|Discordbot|TelegramBot|Pinterest|redditbot|Googlebot|bingbot|Embedly|SkypeUriPreview|vkShare|W3C_Validator) [NC]
  RewriteCond %{QUERY_STRING} (?:^|&)category=([^&]+) [NC]
  RewriteRule ^/?products/?$ http://127.0.0.1:4000/api/og-crawl?path=/products%3Fcategory=%1 [P,QSD,L]
</IfModule>

# Cloudflare / cache safety: these responses depend on the User-Agent, so a cached SPA copy
# must never be served to a crawler (or a crawler copy to a human). The Node endpoint already
# sets Vary: User-Agent; assert it at the edge of Apache too.
<IfModule mod_headers.c>
  Header merge Vary User-Agent
</IfModule>
