<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4A Store - Download App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 100px;
            height: 100px;
            border-radius: 22px;
            margin: 0 auto 20px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 28px;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .tagline {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            text-decoration: none;
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 24px rgba(79, 172, 254, 0.4);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(79, 172, 254, 0.5);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .download-icon {
            font-size: 24px;
        }

        .info {
            margin-top: 24px;
            color: #999;
            font-size: 13px;
        }

        .info .version {
            display: inline-block;
            background: #f0f0f0;
            padding: 4px 12px;
            border-radius: 12px;
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }

        .steps {
            margin-top: 24px;
            text-align: left;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 16px 20px;
        }

        .steps h3 {
            font-size: 14px;
            color: #333;
            margin-bottom: 10px;
        }

        .steps ol {
            font-size: 13px;
            color: #555;
            padding-left: 20px;
            line-height: 1.8;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .feature {
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .feature span {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <img src="assets/images/logo.svg" alt="4A Store"
                 onerror="this.parentElement.innerHTML='<div style=&quot;width:100%;height:100%;background:#2C6FAD;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:bold;color:white;&quot;>4A</div>'">
        </div>

        <h1>4A Store</h1>
        <p class="tagline">Grocery in Minutes</p>

        <a href="4AStore.apk" class="download-btn" download>
            <span class="download-icon">&#11015;</span>
            Download App
        </a>

        <div class="features">
            <div class="feature"><span>&#128230;</span> 1.8 MB</div>
            <div class="feature"><span>&#128274;</span> Safe & Secure</div>
            <div class="feature"><span>&#9889;</span> Fast</div>
        </div>

        <div class="steps">
            <h3>Install kaise karein:</h3>
            <ol>
                <li>Download button click karein</li>
                <li>"Settings" me jaake "Unknown Sources" allow karein</li>
                <li>Downloaded file open karke Install karein</li>
            </ol>
        </div>

        <div class="info">
            Android 7.0+ required
            <br>
            <span class="version">v1.0 | Release</span>
        </div>
    </div>
</body>
</html>
