<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4A Store - QR Code</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
        }

        .banner {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .banner h1 {
            font-size: 32px;
            color: #1a1a2e;
            margin-bottom: 4px;
        }

        .banner .tagline {
            color: #666;
            font-size: 16px;
            margin-bottom: 24px;
        }

        #qrcode {
            display: inline-block;
            padding: 16px;
            background: white;
            border: 3px solid #4facfe;
            border-radius: 16px;
        }

        .scan-text {
            margin-top: 20px;
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .scan-subtext {
            margin-top: 8px;
            font-size: 14px;
            color: #666;
        }

        .print-btn {
            margin-top: 24px;
            padding: 12px 30px;
            background: #4facfe;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }

        .print-btn:hover {
            background: #3a8fd4;
        }

        @media print {
            body { background: white; }
            .print-btn { display: none; }
            .banner { box-shadow: none; border: 2px solid #ddd; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="banner">
            <h1>4A Store</h1>
            <p class="tagline">Grocery in Minutes</p>

            <div id="qrcode"></div>

            <p class="scan-text">Scan to Download App</p>
            <p class="scan-subtext">QR code scan karein aur app install karein</p>

            <button class="print-btn" onclick="window.print()">Print Banner</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
        const downloadUrl = "https://4astore.webtoolsz.com/download.html";

        new QRCode(document.getElementById("qrcode"), {
            text: downloadUrl,
            width: 200,
            height: 200,
            colorDark: "#1a1a2e",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
