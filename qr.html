<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4A Store - Scan &amp; Download App</title>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="description" content="Scan the QR code to download the 4A Store app. Grocery in minutes!">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            /* Colorful animated gradient — WhatsApp status friendly */
            background: linear-gradient(135deg, #7b2ff7, #f107a3, #ff6a00, #4facfe);
            background-size: 400% 400%;
            animation: bgShift 12s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 18px;
        }

        @keyframes bgShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Whole banner is one big clickable link */
        .status-card {
            display: block;
            text-decoration: none;
            color: inherit;
            background: rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 28px;
            padding: 30px 26px 34px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .status-card:hover, .status-card:active {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 28px 60px rgba(0, 0, 0, 0.34);
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            border-radius: 18px;
            background: linear-gradient(135deg, #2C6FAD, #5BA3D9);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
            margin-bottom: 14px;
        }
        .logo-badge img { height: 46px; width: auto; display: block; }

        .headline {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }
        .tagline {
            font-size: 15px;
            color: rgba(255,255,255,0.92);
            margin-top: 4px;
            margin-bottom: 22px;
        }

        /* QR sits on solid white so scanners read it reliably */
        .qr-wrap {
            display: inline-block;
            padding: 16px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.22);
        }
        #qrcode { display: block; }
        #qrcode img, #qrcode canvas { display: block; border-radius: 8px; }

        .scan-text {
            margin-top: 20px;
            font-size: 19px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.22);
        }
        .scan-subtext {
            margin-top: 6px;
            font-size: 13px;
            color: rgba(255,255,255,0.9);
        }

        .cta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            padding: 13px 30px;
            background: #fff;
            color: #7b2ff7;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 800;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .footer-note {
            margin-top: 18px;
            font-size: 12px;
            color: rgba(255,255,255,0.85);
        }

        .print-btn {
            margin-top: 22px;
            padding: 10px 24px;
            background: rgba(0,0,0,0.28);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Force browsers to actually print background colors */
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        @media print {
            @page { margin: 0; }

            html, body {
                width: 100%;
                height: 100%;
                min-height: 100vh;
            }

            body {
                background: linear-gradient(135deg, #7b2ff7, #f107a3, #ff6a00, #4facfe) !important;
                animation: none !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
            }

            /* Solid card so the white text stays readable on paper */
            .status-card {
                background: rgba(255, 255, 255, 0.18) !important;
                border: 2px solid rgba(255, 255, 255, 0.6) !important;
                box-shadow: none !important;
                transform: none !important;
                -webkit-backdrop-filter: none !important;
                backdrop-filter: none !important;
            }

            .headline, .scan-text { color: #ffffff !important; text-shadow: 0 1px 2px rgba(0,0,0,0.4) !important; }
            .tagline, .scan-subtext, .footer-note { color: #ffffff !important; }
            .logo-badge { background: linear-gradient(135deg, #2C6FAD, #5BA3D9) !important; }
            .cta { background: #ffffff !important; color: #7b2ff7 !important; }
            .qr-wrap { background: #ffffff !important; }

            .print-btn { display: none !important; }
        }
    </style>
</head>
<body>
    <!-- The entire card is clickable → directly downloads the APK (relative path works on local + live) -->
    <a id="downloadLink" class="status-card" href="4AStore.apk" download="4AStore.apk" onclick="return startDownload(event)">
        <div class="logo-badge">
            <img src="assets/images/logo.svg?v=2" alt="4A Store"
                 onerror="this.parentElement.innerHTML='<span style=&quot;font-size:26px;font-weight:800;color:#fff;&quot;>4A&nbsp;Store</span>'">
        </div>

        <div class="headline">4A Store App</div>
        <div class="tagline">🛒 Grocery in Minutes</div>

        <div class="qr-wrap">
            <div id="qrcode"></div>
        </div>

        <p class="scan-text">📲 Scan to Download App</p>
        <p class="scan-subtext">QR code scan karein — app turant install hogi</p>

        <span class="cta">⬇️ Tap to Download</span>

        <p class="footer-note">4astore.com</p>

        <button class="print-btn" onclick="event.preventDefault(); event.stopPropagation(); window.print();">🖨️ Save / Print Banner</button>
    </a>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
        // Build the APK URL from the current site so it works on both
        // localhost and the live domain. (QR needs an absolute URL to scan.)
        const apkUrl = new URL('4AStore.apk', window.location.href).href;

        // Make the tap/click download use the same URL
        document.getElementById('downloadLink').setAttribute('href', apkUrl);

        // Force a reliable download regardless of browser handling
        function startDownload(e) {
            if (e) e.preventDefault();
            const a = document.createElement('a');
            a.href = apkUrl;
            a.setAttribute('download', '4AStore.apk');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            return false;
        }

        function renderQr() {
            const box = document.getElementById('qrcode');
            box.innerHTML = '';
            if (typeof QRCode !== 'undefined') {
                new QRCode(box, {
                    text: apkUrl,
                    width: 200,
                    height: 200,
                    colorDark: "#1a1a2e",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            } else {
                // Fallback: image-API QR so it always shows
                const img = document.createElement('img');
                img.width = 200; img.height = 200; img.alt = 'QR';
                img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(apkUrl);
                box.appendChild(img);
            }
        }
        renderQr();
    </script>
</body>
</html>
