<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Bag body -->
  <rect x="8" y="20" width="48" height="40" rx="8" ry="8" fill="#7BB8E8"/>
  <rect x="8" y="20" width="48" height="40" rx="8" ry="8" fill="url(#bagGrad)"/>
  <!-- Bag gradient -->
  <defs>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A8D4F5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5BA3D9;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Handle -->
  <path d="M22 22 C22 12, 42 12, 42 22" fill="none" stroke="#F5A623" stroke-width="5" stroke-linecap="round"/>
  <!-- 4 text -->
  <text x="18" y="50" font-family="Arial Black, sans-serif" font-size="26" font-weight="900" fill="#F5A623">4</text>
  <!-- A text -->
  <text x="35" y="50" font-family="Arial Black, sans-serif" font-size="26" font-weight="900" fill="#4CAF50">A</text>
  <!-- Small apple -->
  <circle cx="16" cy="18" r="4" fill="#E53935"/>
  <path d="M16 14 C16 12, 18 11, 18 13" fill="#4CAF50" stroke="none"/>
  <!-- Small leaf/cucumber -->
  <ellipse cx="48" cy="17" rx="5" ry="3" fill="#388E3C" transform="rotate(-20 48 17)"/>
</svg>
