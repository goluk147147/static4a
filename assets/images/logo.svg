<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 50" width="180" height="50">
  <!-- Bag body -->
  <rect x="4" y="12" width="32" height="34" rx="6" ry="6" fill="url(#logoBagGrad)"/>
  <defs>
    <linearGradient id="logoBagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A8D4F5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5BA3D9;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Handle -->
  <path d="M12 14 C12 5, 28 5, 28 14" fill="none" stroke="#F5A623" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 4 text on bag -->
  <text x="8" y="38" font-family="Arial Black, sans-serif" font-size="18" font-weight="900" fill="#F5A623">4</text>
  <!-- A text on bag -->
  <text x="21" y="38" font-family="Arial Black, sans-serif" font-size="18" font-weight="900" fill="#4CAF50">A</text>
  <!-- Small apple -->
  <circle cx="9" cy="11" r="3" fill="#E53935"/>
  <path d="M9 8 C9 6.5, 10.5 6, 10.5 7.5" fill="#4CAF50"/>
  <!-- Small leaf -->
  <ellipse cx="32" cy="10" rx="3.5" ry="2" fill="#388E3C" transform="rotate(-20 32 10)"/>
  <!-- Store text -->
  <text x="42" y="30" font-family="Arial Black, sans-serif" font-size="18" font-weight="900" fill="#ffffff" letter-spacing="1">STORE</text>
  <!-- Tagline -->
  <text x="42" y="43" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" letter-spacing="0.5">GROCERY IN MINUTES</text>
</svg>
