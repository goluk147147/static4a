<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - 4A Store</title>
  <meta name="description" content="4A Store - Admin panel for managing products, orders and users.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .admin-container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .admin-header h1 { color: var(--primary-dark); font-size: 1.5rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 30px; }
    .stat-card { background: white; border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); text-align: center; border-top: 4px solid var(--primary); }
    .stat-card .stat-icon { font-size: 2rem; margin-bottom: 8px; }
    .stat-card .stat-value { font-size: 1.8rem; font-weight: 800; color: var(--primary-dark); }
    .stat-card .stat-label { font-size: 13px; color: var(--gray); margin-top: 4px; }
    .admin-tabs { display: flex; gap: 4px; margin-bottom: 20px; flex-wrap: wrap; }
    .admin-tabs button { padding: 10px 20px; border: none; background: white; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--gray); transition: var(--transition); }
    .admin-tabs button.active { background: var(--primary); color: white; }
    .admin-tabs button:hover:not(.active) { background: var(--primary-light); }
    .tab-content { background: white; border-radius: 0 12px 12px 12px; box-shadow: var(--shadow); padding: 20px; }
    .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .admin-table th { background: var(--primary-light); color: var(--primary-dark); padding: 12px 10px; text-align: left; font-weight: 700; white-space: nowrap; }
    .admin-table td { padding: 10px; border-bottom: 1px solid var(--border); }
    .admin-table tr:hover { background: #fffaf5; }
    .status-select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .admin-login { max-width: 400px; margin: 80px auto; text-align: center; }
    .admin-login .checkout-form { padding: 40px 30px; }
    .logout-btn { padding: 8px 16px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .order-detail-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .order-detail-modal .modal-body { background: white; border-radius: 16px; padding: 24px; max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto; }
    .prod-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .prod-form-grid .full { grid-column: 1 / -1; }
    .prod-form-grid label { display: block; font-size: 12px; font-weight: 600; color: var(--primary-dark); margin-bottom: 4px; }
    .prod-form-grid input, .prod-form-grid select, .prod-form-grid textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; }
    .prod-form-grid textarea { resize: vertical; min-height: 60px; }
    .btn-add-product { padding: 10px 18px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .prod-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); background:#f5f5f5; }
    .stock-badge { padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .stock-in { background:#e8f5e9; color:#2e7d32; }
    .stock-out { background:#ffebee; color:#c62828; }
    @media (max-width: 600px) { .prod-form-grid { grid-template-columns: 1fr; } }
    @media (max-width: 768px) {
      .admin-table { font-size: 11px; }
      .admin-table th, .admin-table td { padding: 8px 6px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="location-text">🔒 Admin Panel - 4astore</div>
  </div>

  <!-- Header -->
  <header class="main-header">
    <div class="header-content">
      <a href="./" class="logo"><img src="assets/images/logo.svg" alt="4A Store" height="52"></a>
      <div style="flex:1"></div>
      <div class="header-actions">
        <a href="./">🏠 <span class="action-text">Store</span></a>
      </div>
    </div>
  </header>

  <!-- Admin Login -->
  <div id="adminLogin" class="admin-login">
    <div class="checkout-form">
      <div style="font-size:3rem; margin-bottom:12px;">🔐</div>
      <h2 style="color:var(--primary); margin-bottom:16px;">Admin Login</h2>
      <div class="form-group">
        <label>Admin Password</label>
        <input type="password" id="adminPass" placeholder="Enter admin password">
        <div class="error-msg">Incorrect password</div>
      </div>
      <button class="btn-checkout" onclick="adminLogin()">🔓 Login</button>
      <p style="margin-top:12px; font-size:11px; color:var(--gray);">Default: 4astore@admin</p>
    </div>
  </div>

  <!-- Admin Dashboard (hidden until login) -->
  <div id="adminDashboard" class="admin-container hidden">
    <div class="admin-header">
      <h1>📊 4astore Admin Panel</h1>
      <button class="logout-btn" onclick="adminLogout()">🚪 Logout</button>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">📦</div>
        <div class="stat-value" id="statTotalOrders">0</div>
        <div class="stat-label">Total Orders</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">💰</div>
        <div class="stat-value" id="statTodayEarning">₹0</div>
        <div class="stat-label">Today's Earning</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📅</div>
        <div class="stat-value" id="statMonthEarning">₹0</div>
        <div class="stat-label">This Month</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">👥</div>
        <div class="stat-value" id="statTotalUsers">0</div>
        <div class="stat-label">Registered Users</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🛍️</div>
        <div class="stat-value" id="statTotalProducts">0</div>
        <div class="stat-label">Total Products</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="admin-tabs">
      <button class="active" onclick="showTab('orders')">📦 Orders</button>
      <button onclick="showTab('products')">🛍️ Products</button>
      <button onclick="showTab('users')">👥 Users</button>
      <button onclick="showTab('earnings')">💰 Earnings</button>
      <button onclick="showTab('settings')">⚙️ Settings</button>
    </div>

    <!-- Tab Content -->
    <div class="tab-content" id="tabContent">
      <!-- Dynamic content -->
    </div>
  </div>

  <!-- Order Detail Modal -->
  <div id="orderDetailModal" class="order-detail-modal hidden" onclick="if(event.target===this)closeOrderDetail()">
    <div class="modal-body" id="orderDetailBody"></div>
  </div>

  <!-- Product Edit Modal -->
  <div id="productModal" class="order-detail-modal hidden" onclick="if(event.target===this)closeProductModal()">
    <div class="modal-body" id="productModalBody"></div>
  </div>

  <script src="assets/js/app.js"></script>
  <script>
    const ADMIN_KEY = '4astore_admin_logged';

    document.addEventListener('DOMContentLoaded', () => {
      // Check if logged-in user is authorized for admin access
      const user = getLoggedInUser();
      const adminData = JSON.parse(localStorage.getItem('4astore_admin'));
      const authorizedMobiles = adminData ? (adminData.authorizedMobiles || []) : [];
      const adminMobile = adminData ? adminData.mobile : '';
      
      if (!user || (!authorizedMobiles.includes(user.mobile) && user.mobile !== adminMobile)) {
        // Not authorized - redirect to home
        showToast('Access denied. Admin only.', 'error');
        setTimeout(() => { window.location.href = './'; }, 1000);
        return;
      }

      if (sessionStorage.getItem(ADMIN_KEY) === 'true') {
        showDashboard();
      }
    });

    document.getElementById('adminPass').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') adminLogin();
    });

    function adminLogin() {
      const pass = document.getElementById('adminPass').value;
      const adminCreds = getAdminCredentials();
      if (pass === adminCreds.password) {
        sessionStorage.setItem(ADMIN_KEY, 'true');
        showDashboard();
      } else {
        document.getElementById('adminPass').parentElement.classList.add('error');
        showToast('Incorrect password', 'error');
      }
    }

    function adminLogout() {
      sessionStorage.removeItem(ADMIN_KEY);
      document.getElementById('adminDashboard').classList.add('hidden');
      document.getElementById('adminLogin').style.display = 'block';
      document.getElementById('adminPass').value = '';
    }

    function showDashboard() {
      document.getElementById('adminLogin').style.display = 'none';
      document.getElementById('adminDashboard').classList.remove('hidden');
      loadStats();
      showTab('orders');
    }

    function loadStats() {
      const orders = getOrders();
      const users = getUsers();
      const today = new Date().toDateString();
      const thisMonth = new Date().getMonth();
      const thisYear = new Date().getFullYear();

      const todayOrders = orders.filter(o => new Date(o.orderDate).toDateString() === today);
      const monthOrders = orders.filter(o => {
        const d = new Date(o.orderDate);
        return d.getMonth() === thisMonth && d.getFullYear() === thisYear;
      });

      const todayEarning = todayOrders.reduce((s, o) => s + o.totalAmount, 0);
      const monthEarning = monthOrders.reduce((s, o) => s + o.totalAmount, 0);

      document.getElementById('statTotalOrders').textContent = orders.length;
      document.getElementById('statTodayEarning').textContent = '₹' + todayEarning;
      document.getElementById('statMonthEarning').textContent = '₹' + monthEarning;
      document.getElementById('statTotalUsers').textContent = users.length;
      document.getElementById('statTotalProducts').textContent = getProducts().length;
    }

    function showTab(tab) {
      document.querySelectorAll('.admin-tabs button').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (tab === 'orders') renderOrdersTab();
      else if (tab === 'products') renderProductsTab();
      else if (tab === 'users') renderUsersTab();
      else if (tab === 'earnings') renderEarningsTab();
      else if (tab === 'settings') renderSettingsTab();
    }

    function renderOrdersTab() {
      const orders = getOrders();
      if (orders.length === 0) {
        document.getElementById('tabContent').innerHTML = '<p style="text-align:center;padding:40px;color:var(--gray);">No orders yet</p>';
        return;
      }

      document.getElementById('tabContent').innerHTML = `
        <div style="overflow-x:auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Date</th>
                <th>Customer</th>
                <th>Mobile</th>
                <th>Items</th>
                <th>Total</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              ${orders.map(o => `
                <tr>
                  <td><strong>#${o.orderId}</strong></td>
                  <td>${formatDate(o.orderDate)}</td>
                  <td>${o.customer.name}</td>
                  <td><a href="tel:${o.customer.mobile}">${o.customer.mobile}</a></td>
                  <td>${o.items.length} items</td>
                  <td><strong>₹${o.totalAmount}</strong></td>
                  <td>
                    <select class="status-select" onchange="changeStatus('${o.orderId}', this.value)">
                      <option value="Order Placed" ${o.orderStatus==='Order Placed'?'selected':''}>📋 Order Placed</option>
                      <option value="Confirmed" ${o.orderStatus==='Confirmed'?'selected':''}>✅ Confirmed</option>
                      <option value="Processing" ${o.orderStatus==='Processing'?'selected':''}>⚙️ Processing</option>
                      <option value="Out for Delivery" ${o.orderStatus==='Out for Delivery'?'selected':''}>🚴 Out for Delivery</option>
                      <option value="Delivered" ${o.orderStatus==='Delivered'?'selected':''}>✅ Delivered</option>
                    </select>
                  </td>
                  <td><button onclick="viewOrder('${o.orderId}')" style="padding:6px 12px;background:var(--primary);color:white;border:none;border-radius:6px;cursor:pointer;font-size:12px;">👁️ View</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>`;
    }

    function renderUsersTab() {
      const users = getUsers();
      if (users.length === 0) {
        document.getElementById('tabContent').innerHTML = '<p style="text-align:center;padding:40px;color:var(--gray);">No registered users</p>';
        return;
      }

      const now = new Date();

      document.getElementById('tabContent').innerHTML = `
        <div style="margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
          <p style="font-size:13px; color:var(--gray);">Total: <strong>${users.length}</strong> users</p>
          <button onclick="deleteInactiveUsers()" style="padding:8px 16px; background:#e53935; color:white; border:none; border-radius:8px; cursor:pointer; font-size:12px; font-weight:600;">🗑️ Delete 30+ Days Inactive</button>
        </div>
        <div style="overflow-x:auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Username</th>
                <th>Mobile</th>
                <th>Password</th>
                <th>Registered</th>
                <th>Last Login</th>
                <th>Inactive</th>
                <th>Orders</th>
                <th>Spent</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              ${users.map((u, i) => {
                const userOrders = getOrdersByUser(u.mobile);
                const totalSpent = userOrders.reduce((s, o) => s + o.totalAmount, 0);
                const lastLogin = u.lastLogin ? new Date(u.lastLogin) : null;
                const daysSinceLogin = lastLogin ? Math.floor((now - lastLogin) / (1000 * 60 * 60 * 24)) : 999;
                const inactiveClass = daysSinceLogin >= 30 ? 'color:#e53935; font-weight:700;' : 'color:#2e7d32;';
                return `
                <tr>
                  <td>${u.id || i + 1}</td>
                  <td><strong>${u.name}</strong></td>
                  <td>${u.username || '-'}</td>
                  <td><a href="tel:${u.mobile}">${u.mobile}</a></td>
                  <td style="font-family:monospace; font-size:11px;">${u.password || '-'}</td>
                  <td>${u.registeredAt ? formatDate(u.registeredAt) : '-'}</td>
                  <td>${lastLogin ? formatDate(u.lastLogin) : 'Never'}</td>
                  <td style="${inactiveClass}">${daysSinceLogin >= 999 ? 'Never' : daysSinceLogin + ' days'}</td>
                  <td>${userOrders.length}</td>
                  <td><strong>₹${totalSpent}</strong></td>
                  <td><button onclick="deleteUser('${u.mobile}', '${u.name}')" style="padding:5px 10px; background:#e53935; color:white; border:none; border-radius:6px; cursor:pointer; font-size:11px;">🗑️</button></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`; 
    }

    function renderEarningsTab() {
      const orders = getOrders();
      const today = new Date();
      
      // Group by date
      const dailyMap = {};
      orders.forEach(o => {
        const dateKey = new Date(o.orderDate).toLocaleDateString('en-IN');
        if (!dailyMap[dateKey]) dailyMap[dateKey] = { count: 0, total: 0 };
        dailyMap[dateKey].count++;
        dailyMap[dateKey].total += o.totalAmount;
      });

      const dailyEntries = Object.entries(dailyMap).slice(0, 30); // Last 30 days max
      
      // Monthly totals
      const monthlyMap = {};
      orders.forEach(o => {
        const d = new Date(o.orderDate);
        const key = d.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
        if (!monthlyMap[key]) monthlyMap[key] = { count: 0, total: 0 };
        monthlyMap[key].count++;
        monthlyMap[key].total += o.totalAmount;
      });

      const totalEarning = orders.reduce((s, o) => s + o.totalAmount, 0);

      document.getElementById('tabContent').innerHTML = `
        <div style="margin-bottom:20px; padding:16px; background:var(--primary-light); border-radius:12px; text-align:center;">
          <p style="font-size:14px; color:var(--gray);">Total All-Time Earning</p>
          <p style="font-size:2rem; font-weight:800; color:var(--primary-dark);">₹${totalEarning}</p>
        </div>
        
        <h4 style="margin-bottom:12px;">📅 Monthly Earnings</h4>
        <div style="overflow-x:auto; margin-bottom:24px;">
          <table class="admin-table">
            <thead><tr><th>Month</th><th>Orders</th><th>Earning</th></tr></thead>
            <tbody>
              ${Object.entries(monthlyMap).map(([month, data]) => `
                <tr><td>${month}</td><td>${data.count}</td><td><strong>₹${data.total}</strong></td></tr>
              `).join('')}
            </tbody>
          </table>
        </div>

        <h4 style="margin-bottom:12px;">📊 Daily Breakdown</h4>
        <div style="overflow-x:auto;">
          <table class="admin-table">
            <thead><tr><th>Date</th><th>Orders</th><th>Earning</th></tr></thead>
            <tbody>
              ${dailyEntries.map(([date, data]) => `
                <tr><td>${date}</td><td>${data.count}</td><td><strong>₹${data.total}</strong></td></tr>
              `).join('')}
            </tbody>
          </table>
        </div>`;
    }

    function changeStatus(orderId, newStatus) {
      updateOrderStatus(orderId, newStatus);
      showToast(`Order #${orderId} → ${newStatus}`, 'success');
      loadStats();
    }

    // Delete single user
    function deleteUser(mobile, name) {
      if (!confirm(`Delete user "${name}" (${mobile})? This cannot be undone!`)) return;
      
      try {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', 'api/users.php', false);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.send(JSON.stringify({ action: 'delete', mobile: mobile }));
        const res = JSON.parse(xhr.responseText);
        if (res.success) {
          showToast(`User "${name}" deleted`, 'success');
        } else {
          // Fallback: delete from localStorage
          let users = getUsers();
          users = users.filter(u => u.mobile !== mobile);
          localStorage.setItem('4astore_users', JSON.stringify(users));
          showToast(`User "${name}" deleted (local)`, 'success');
        }
      } catch(e) {
        // Fallback: delete from localStorage
        let users = getUsers();
        users = users.filter(u => u.mobile !== mobile);
        localStorage.setItem('4astore_users', JSON.stringify(users));
        showToast(`User "${name}" deleted (local)`, 'success');
      }
      
      loadStats();
      renderUsersTab();
    }

    // Delete all users inactive for 30+ days
    function deleteInactiveUsers() {
      const users = getUsers();
      const now = new Date();
      const inactiveUsers = users.filter(u => {
        const lastLogin = u.lastLogin ? new Date(u.lastLogin) : null;
        const daysSinceLogin = lastLogin ? Math.floor((now - lastLogin) / (1000 * 60 * 60 * 24)) : 999;
        return daysSinceLogin >= 30;
      });

      if (inactiveUsers.length === 0) {
        showToast('No inactive users to delete', 'info');
        return;
      }

      if (!confirm(`Delete ${inactiveUsers.length} users who haven't logged in for 30+ days? This cannot be undone!`)) return;

      try {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', 'api/users.php', false);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.send(JSON.stringify({ action: 'deleteInactive', days: 30 }));
        const res = JSON.parse(xhr.responseText);
        if (res.success) {
          showToast(`${res.deleted} inactive users deleted`, 'success');
        }
      } catch(e) {
        // Fallback: delete locally
        const activeUsers = users.filter(u => {
          const lastLogin = u.lastLogin ? new Date(u.lastLogin) : null;
          const daysSinceLogin = lastLogin ? Math.floor((now - lastLogin) / (1000 * 60 * 60 * 24)) : 999;
          return daysSinceLogin < 30;
        });
        localStorage.setItem('4astore_users', JSON.stringify(activeUsers));
        showToast(`${inactiveUsers.length} inactive users deleted (local)`, 'success');
      }

      loadStats();
      renderUsersTab();
    }

    function viewOrder(orderId) {
      const orders = getOrders();
      const o = orders.find(ord => ord.orderId === orderId);
      if (!o) return;

      // Check for payment screenshot
      const screenshots = JSON.parse(localStorage.getItem('4astore_screenshots')) || {};
      const screenshot = screenshots[orderId];
      const screenshotHTML = screenshot 
        ? `<h4 style="margin-top:16px; margin-bottom:8px;">📸 Payment Screenshot</h4>
           <img src="${screenshot}" style="max-width:100%; border-radius:8px; border:2px solid var(--primary);" alt="Payment Screenshot">`
        : `<p style="margin-top:12px; font-size:13px; color:var(--gray);">⚠️ No payment screenshot uploaded</p>`;

      document.getElementById('orderDetailBody').innerHTML = `
        <h3 style="color:var(--primary); margin-bottom:12px;">Order #${o.orderId}</h3>
        <p style="font-size:13px; color:var(--gray); margin-bottom:16px;">${formatDate(o.orderDate)}</p>
        
        <h4 style="margin-bottom:8px;">👤 Customer</h4>
        <p><strong>${o.customer.name}</strong></p>
        <p>📱 <a href="tel:${o.customer.mobile}">${o.customer.mobile}</a></p>
        <p>📍 ${o.customer.address}, ${o.customer.city} – ${o.customer.pincode}</p>
        ${o.customer.landmark ? `<p>🏷️ ${o.customer.landmark}</p>` : ''}
        
        <h4 style="margin-top:16px; margin-bottom:8px;">📦 Items</h4>
        ${o.items.map(item => `
          <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:14px;">
            <span>${item.name} × ${item.quantity}</span>
            <span>₹${item.price * item.quantity}</span>
          </div>
        `).join('')}
        
        <div style="margin-top:12px; padding-top:12px; border-top:2px solid var(--border);">
          <div style="display:flex;justify-content:space-between;font-size:14px;"><span>Subtotal</span><span>₹${o.subtotal}</span></div>
          <div style="display:flex;justify-content:space-between;font-size:14px;color:var(--primary);"><span>Discount</span><span>-₹${o.discount}</span></div>
          <div style="display:flex;justify-content:space-between;font-size:14px;"><span>Delivery</span><span>₹${o.deliveryCharge}</span></div>
          <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:700;color:var(--primary-dark);margin-top:8px;padding-top:8px;border-top:2px solid var(--border);">
            <span>Total</span><span>₹${o.totalAmount}</span>
          </div>
        </div>
        
        <div style="margin-top:16px; padding:12px; background:var(--primary-light); border-radius:8px;">
          <p><strong>Payment:</strong> ${o.paymentMethod}</p>
          <p><strong>Status:</strong> <span class="order-status ${getStatusClass(o.orderStatus)}">${o.orderStatus}</span></p>
        </div>
        
        ${screenshotHTML}
        
        <button onclick="closeOrderDetail()" style="margin-top:16px; width:100%; padding:10px; background:var(--gray); color:white; border:none; border-radius:8px; cursor:pointer;">Close</button>
      `;
      
      document.getElementById('orderDetailModal').classList.remove('hidden');
    }

    function closeOrderDetail() {
      document.getElementById('orderDetailModal').classList.add('hidden');
    }

    // ==========================================
    // PRODUCTS TAB — add / edit price & features
    // ==========================================
    function renderProductsTab() {
      const prods = getProducts();
      const cats = (typeof categories !== 'undefined' && categories.length) ? categories : [];

      const rows = prods.length ? prods.map(p => {
        const featCount = Array.isArray(p.features) ? p.features.length : 0;
        return `
          <tr>
            <td>${p.id}</td>
            <td><img class="prod-thumb" src="${p.image || ''}" alt="" onerror="this.style.visibility='hidden'"></td>
            <td><strong>${escapeHtml(p.name)}</strong><div style="font-size:11px;color:var(--gray);">${escapeHtml(p.brand || '')} · ${escapeHtml(p.weight || '')}</div></td>
            <td>${escapeHtml(p.category || '')}</td>
            <td>₹${p.mrp}</td>
            <td><strong style="color:var(--primary-dark);">₹${p.price}</strong></td>
            <td>${p.discount || 0}%</td>
            <td>${featCount ? featCount + ' ✨' : '-'}</td>
            <td><span class="stock-badge ${p.inStock ? 'stock-in' : 'stock-out'}">${p.inStock ? 'In Stock' : 'Out'}</span></td>
            <td style="white-space:nowrap;">
              <button onclick="openProductModal(${p.id})" style="padding:5px 10px;background:var(--primary);color:white;border:none;border-radius:6px;cursor:pointer;font-size:11px;margin-right:4px;">✏️ Edit</button>
              <button onclick="removeProduct(${p.id})" style="padding:5px 10px;background:#e53935;color:white;border:none;border-radius:6px;cursor:pointer;font-size:11px;">🗑️</button>
            </td>
          </tr>`;
      }).join('') : `<tr><td colspan="10" style="text-align:center;padding:30px;color:var(--gray);">No products yet. Click "Add Product".</td></tr>`;

      document.getElementById('tabContent').innerHTML = `
        <div style="margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
          <p style="font-size:13px; color:var(--gray);">Total: <strong>${prods.length}</strong> products</p>
          <button class="btn-add-product" onclick="openProductModal()">➕ Add Product</button>
        </div>
        <div style="overflow-x:auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th><th>Image</th><th>Name</th><th>Category</th>
                <th>MRP</th><th>Price</th><th>Disc</th><th>Features</th><th>Stock</th><th>Action</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function openProductModal(id) {
      const isEdit = id !== undefined && id !== null;
      const prods = getProducts();
      const p = isEdit ? prods.find(pr => parseInt(pr.id, 10) === parseInt(id, 10)) : {};
      if (isEdit && !p) { showToast('Product not found', 'error'); return; }

      const cats = (typeof categories !== 'undefined' && categories.length) ? categories : [];
      const catOptions = cats.map(c =>
        `<option value="${c.slug}" ${p.category === c.slug ? 'selected' : ''}>${escapeHtml(c.name)}</option>`
      ).join('');

      const featuresText = Array.isArray(p.features) ? p.features.join('\n') : '';

      document.getElementById('productModalBody').innerHTML = `
        <h3 style="color:var(--primary); margin-bottom:16px;">${isEdit ? '✏️ Edit Product' : '➕ Add Product'}</h3>
        <input type="hidden" id="pf_id" value="${isEdit ? p.id : ''}">
        <div class="prod-form-grid">
          <div class="full">
            <label>Product Name *</label>
            <input type="text" id="pf_name" value="${escapeHtml(p.name || '')}" placeholder="e.g. Aashirvaad Atta">
          </div>
          <div>
            <label>Brand</label>
            <input type="text" id="pf_brand" value="${escapeHtml(p.brand || '')}" placeholder="e.g. Aashirvaad">
          </div>
          <div>
            <label>Weight / Size</label>
            <input type="text" id="pf_weight" value="${escapeHtml(p.weight || '')}" placeholder="e.g. 5 Kg">
          </div>
          <div class="full">
            <label>Category</label>
            <select id="pf_category">
              <option value="">— Select category —</option>
              ${catOptions}
            </select>
          </div>
          <div>
            <label>MRP (₹)</label>
            <input type="number" id="pf_mrp" min="0" step="0.01" value="${p.mrp != null ? p.mrp : ''}" oninput="autoDiscount()" placeholder="0">
          </div>
          <div>
            <label>Selling Price (₹) *</label>
            <input type="number" id="pf_price" min="0" step="0.01" value="${p.price != null ? p.price : ''}" oninput="autoDiscount()" placeholder="0">
          </div>
          <div>
            <label>Discount (%)</label>
            <input type="number" id="pf_discount" min="0" max="100" value="${p.discount != null ? p.discount : ''}" placeholder="auto">
          </div>
          <div>
            <label>In Stock?</label>
            <select id="pf_instock">
              <option value="1" ${p.inStock !== false ? 'selected' : ''}>✅ In Stock</option>
              <option value="0" ${p.inStock === false ? 'selected' : ''}>❌ Out of Stock</option>
            </select>
          </div>
          <div class="full">
            <label>Image URL</label>
            <input type="text" id="pf_image" value="${escapeHtml(p.image || '')}" placeholder="https://...">
          </div>
          <div class="full">
            <label>Description</label>
            <textarea id="pf_description" placeholder="Short product description">${escapeHtml(p.description || '')}</textarea>
          </div>
          <div class="full">
            <label>Features (one per line, or comma separated)</label>
            <textarea id="pf_features" placeholder="100% whole wheat&#10;Soft rotis every time&#10;No added maida">${escapeHtml(featuresText)}</textarea>
          </div>
        </div>
        <div style="display:flex; gap:10px; margin-top:18px;">
          <button onclick="saveProduct()" style="flex:1; padding:11px; background:var(--primary); color:white; border:none; border-radius:8px; cursor:pointer; font-weight:600;">💾 ${isEdit ? 'Update' : 'Add'} Product</button>
          <button onclick="closeProductModal()" style="padding:11px 20px; background:var(--gray); color:white; border:none; border-radius:8px; cursor:pointer;">Cancel</button>
        </div>`;

      document.getElementById('productModal').classList.remove('hidden');
    }

    function autoDiscount() {
      const mrp = parseFloat(document.getElementById('pf_mrp').value) || 0;
      const price = parseFloat(document.getElementById('pf_price').value) || 0;
      const discEl = document.getElementById('pf_discount');
      if (mrp > 0 && price >= 0 && price <= mrp) {
        discEl.value = Math.round(((mrp - price) / mrp) * 100);
      }
    }

    function closeProductModal() {
      document.getElementById('productModal').classList.add('hidden');
    }

    function saveProduct() {
      const idVal = document.getElementById('pf_id').value;
      const data = {
        name: document.getElementById('pf_name').value,
        brand: document.getElementById('pf_brand').value,
        weight: document.getElementById('pf_weight').value,
        category: document.getElementById('pf_category').value,
        mrp: document.getElementById('pf_mrp').value,
        price: document.getElementById('pf_price').value,
        discount: document.getElementById('pf_discount').value,
        image: document.getElementById('pf_image').value,
        description: document.getElementById('pf_description').value,
        features: document.getElementById('pf_features').value,
        inStock: document.getElementById('pf_instock').value === '1'
      };

      if (!data.name.trim()) { showToast('Product name is required', 'error'); return; }
      if (data.price === '' || isNaN(parseFloat(data.price))) { showToast('Valid selling price is required', 'error'); return; }

      const res = idVal ? updateProduct(idVal, data) : addProduct(data);
      if (res.success) {
        showToast(idVal ? 'Product updated' : 'Product added', 'success');
        closeProductModal();
        loadStats();
        renderProductsTab();
      } else {
        showToast(res.message || 'Failed to save product', 'error');
      }
    }

    function removeProduct(id) {
      const p = getProducts().find(pr => parseInt(pr.id, 10) === parseInt(id, 10));
      if (!p) return;
      if (!confirm(`Delete product "${p.name}"? This cannot be undone!`)) return;
      const res = deleteProduct(id);
      if (res.success) {
        showToast('Product deleted', 'success');
        loadStats();
        renderProductsTab();
      } else {
        showToast(res.message || 'Failed to delete', 'error');
      }
    }

    function renderSettingsTab() {
      const savedFestival = localStorage.getItem('4astore_festival') || '';
      const s = getSettings();
      document.getElementById('tabContent').innerHTML = `
        <h4 style="margin-bottom:16px;">🏪 Store Settings</h4>
        <p style="font-size:13px; color:var(--gray); margin-bottom:16px;">Order notification email and delivery charges. These apply across the store.</p>

        <div style="max-width:520px; display:grid; gap:14px; margin-bottom:12px;">
          <div>
            <label style="display:block; font-size:13px; font-weight:600; color:var(--primary-dark); margin-bottom:4px;">📧 Order Notification Email</label>
            <input type="email" id="setEmail" value="${s.storeEmail || ''}" placeholder="you@example.com" style="width:100%; padding:10px 12px; border:2px solid var(--border); border-radius:8px; font-size:14px;">
            <p style="font-size:11px; color:var(--gray); margin-top:4px;">New orders are automatically emailed to this address.</p>
          </div>
          <div style="display:flex; gap:12px; flex-wrap:wrap;">
            <div style="flex:1; min-width:150px;">
              <label style="display:block; font-size:13px; font-weight:600; color:var(--primary-dark); margin-bottom:4px;">🚚 Delivery Fee (₹)</label>
              <input type="number" id="setDelivery" min="0" value="${s.deliveryCharge}" style="width:100%; padding:10px 12px; border:2px solid var(--border); border-radius:8px; font-size:14px;">
            </div>
            <div style="flex:1; min-width:150px;">
              <label style="display:block; font-size:13px; font-weight:600; color:var(--primary-dark); margin-bottom:4px;">🆓 Free Delivery Above (₹)</label>
              <input type="number" id="setFreeAbove" min="0" value="${s.freeDeliveryAbove}" style="width:100%; padding:10px 12px; border:2px solid var(--border); border-radius:8px; font-size:14px;">
            </div>
          </div>
          <div style="display:flex; gap:12px; flex-wrap:wrap;">
            <div style="flex:1; min-width:180px;">
              <label style="display:block; font-size:13px; font-weight:600; color:var(--primary-dark); margin-bottom:4px;">💳 UPI ID</label>
              <input type="text" id="setUpiId" value="${s.upiId || ''}" placeholder="yourname@bank" style="width:100%; padding:10px 12px; border:2px solid var(--border); border-radius:8px; font-size:14px;">
              <p style="font-size:11px; color:var(--gray); margin-top:4px;">Used for the payment QR code &amp; UPI app on checkout.</p>
            </div>
            <div style="flex:1; min-width:150px;">
              <label style="display:block; font-size:13px; font-weight:600; color:var(--primary-dark); margin-bottom:4px;">🏷️ UPI Name (Payee)</label>
              <input type="text" id="setUpiName" value="${s.upiName || ''}" placeholder="4astore" style="width:100%; padding:10px 12px; border:2px solid var(--border); border-radius:8px; font-size:14px;">
            </div>
          </div>
          <button onclick="saveStoreSettings()" style="justify-self:start; padding:11px 26px; background:var(--primary); color:white; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;">
            💾 Save Store Settings
          </button>
        </div>

        <hr style="border:none; border-top:1px solid var(--border); margin:24px 0;">

        <h4 style="margin-bottom:16px;">🎉 Festival / Theme Settings</h4>
        <p style="font-size:13px; color:var(--gray); margin-bottom:16px;">Change the current festival to show relevant banners on the homepage. Leave empty for default banners.</p>
        
        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;">
          <select id="festivalSelect" style="padding:10px 16px; border:2px solid var(--border); border-radius:8px; font-size:14px; flex:1; min-width:200px;">
            <option value="" ${savedFestival===''?'selected':''}>🏪 Default (No Festival)</option>
            <option value="diwali" ${savedFestival==='diwali'?'selected':''}>🪔 Diwali</option>
            <option value="navratri" ${savedFestival==='navratri'?'selected':''}>🕉️ Navratri</option>
            <option value="eid" ${savedFestival==='eid'?'selected':''}>☪️ Eid</option>
            <option value="christmas" ${savedFestival==='christmas'?'selected':''}>🎄 Christmas / New Year</option>
            <option value="holi" ${savedFestival==='holi'?'selected':''}>🎨 Holi</option>
            <option value="ipl" ${savedFestival==='ipl'?'selected':''}>🏏 IPL Season</option>
            <option value="rakhi" ${savedFestival==='rakhi'?'selected':''}>🪢 Raksha Bandhan</option>
            <option value="independence" ${savedFestival==='independence'?'selected':''}>🇮🇳 Independence Day</option>
          </select>
          <button onclick="saveFestival()" style="padding:10px 24px; background:var(--primary); color:white; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;">
            💾 Save Festival
          </button>
        </div>
        
        <div style="background:var(--primary-light); padding:16px; border-radius:8px;">
          <p style="font-size:12px; color:var(--primary-dark); font-weight:600;">ℹ️ How it works:</p>
          <p style="font-size:12px; color:#666; margin-top:4px;">When you select a festival, the homepage will show festival-specific banners along with the default ones. Banners are configured in <code>data/config.json</code>.</p>
        </div>

        <h4 style="margin-top:24px; margin-bottom:12px;">🗑️ Data Management</h4>
        <button onclick="if(confirm('Clear all orders? This cannot be undone!')){localStorage.removeItem('4astore_orders');localStorage.removeItem('4astore_screenshots');loadData().then(()=>{showToast('Orders reset to JSON defaults','info');loadStats();renderOrdersTab();})}" style="padding:10px 20px; background:var(--accent); color:white; border:none; border-radius:8px; cursor:pointer; font-size:13px; margin-right:8px;">
          🗑️ Reset Orders (from JSON)
        </button>
        <button onclick="if(confirm('Clear all users? This cannot be undone!')){localStorage.removeItem('4astore_users');loadData().then(()=>{showToast('Users reset to JSON defaults','info');loadStats();})}" style="padding:10px 20px; background:#666; color:white; border:none; border-radius:8px; cursor:pointer; font-size:13px;">
          🗑️ Reset Users (from JSON)
        </button>

        <h4 style="margin-top:24px; margin-bottom:12px;">💾 Export Data (Download as JSON)</h4>
        <p style="font-size:13px; color:var(--gray); margin-bottom:12px;">Download current data to update your <code>data/</code> folder JSON files. This keeps your database in sync.</p>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button onclick="exportData('users')" style="padding:10px 16px; background:#1565c0; color:white; border:none; border-radius:8px; cursor:pointer; font-size:13px;">
            📥 Export Users
          </button>
          <button onclick="exportData('orders')" style="padding:10px 16px; background:#2e7d32; color:white; border:none; border-radius:8px; cursor:pointer; font-size:13px;">
            📥 Export Orders
          </button>
          <button onclick="exportData('products')" style="padding:10px 16px; background:#ef6c00; color:white; border:none; border-radius:8px; cursor:pointer; font-size:13px;">
            📥 Export Products
          </button>
          <button onclick="exportData('all')" style="padding:10px 16px; background:var(--primary); color:white; border:none; border-radius:8px; cursor:pointer; font-size:13px;">
            📥 Export All Data
          </button>
        </div>

        <h4 style="margin-top:24px; margin-bottom:12px;">📤 Import Data (Load JSON File)</h4>
        <p style="font-size:13px; color:var(--gray); margin-bottom:12px;">Import a previously exported JSON file to restore users or orders.</p>
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <select id="importType" style="padding:10px 12px; border:2px solid var(--border); border-radius:8px; font-size:13px;">
            <option value="users">Users</option>
            <option value="orders">Orders</option>
          </select>
          <label style="padding:10px 16px; background:#6a1b9a; color:white; border:none; border-radius:8px; cursor:pointer; font-size:13px; display:inline-block;">
            📤 Choose File
            <input type="file" accept=".json" onchange="importData(this)" style="display:none;">
          </label>
        </div>
      `;
    }

    function saveFestival() {
      const val = document.getElementById('festivalSelect').value;
      localStorage.setItem('4astore_festival', val);
      showToast(`Festival updated to: ${val || 'Default'}`, 'success');
    }

    function saveStoreSettings() {
      const email = document.getElementById('setEmail').value.trim();
      const delivery = document.getElementById('setDelivery').value;
      const freeAbove = document.getElementById('setFreeAbove').value;

      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showToast('Please enter a valid email address', 'error');
        return;
      }

      const res = saveSettings({
        storeEmail: email,
        deliveryCharge: delivery,
        freeDeliveryAbove: freeAbove,
        upiId: document.getElementById('setUpiId').value.trim(),
        upiName: document.getElementById('setUpiName').value.trim()
      });

      if (res.success) {
        showToast('✅ Store settings saved', 'success');
      } else {
        showToast(res.message || 'Failed to save settings', 'error');
      }
    }

    // ==========================================
    // EXPORT / IMPORT (JSON DB Sync)
    // ==========================================
    function exportData(type) {
      let data, filename;
      
      if (type === 'users') {
        data = getUsers();
        filename = 'users.json';
      } else if (type === 'orders') {
        data = getOrders();
        filename = 'orders.json';
      } else if (type === 'products') {
        data = getProducts();
        filename = 'products.json';
      } else {
        // Export all
        data = {
          users: getUsers(),
          orders: getOrders(),
          admin: getAdminCredentials(),
          exportDate: new Date().toISOString()
        };
        filename = '4astore_backup_' + new Date().toISOString().split('T')[0] + '.json';
      }

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`📥 ${filename} downloaded successfully`, 'success');
    }

    function importData(input) {
      const file = input.files[0];
      if (!file) return;

      const type = document.getElementById('importType').value;
      const reader = new FileReader();
      
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          
          if (!Array.isArray(data)) {
            showToast('Invalid file format. Expected a JSON array.', 'error');
            return;
          }

          if (type === 'users') {
            // Validate user structure
            if (data.length > 0 && !data[0].mobile) {
              showToast('Invalid users file format', 'error');
              return;
            }
            localStorage.setItem('4astore_users', JSON.stringify(data));
            dbUsers = data;
            showToast(`✅ ${data.length} users imported successfully`, 'success');
          } else if (type === 'orders') {
            // Validate orders structure
            if (data.length > 0 && !data[0].orderId) {
              showToast('Invalid orders file format', 'error');
              return;
            }
            localStorage.setItem('4astore_orders', JSON.stringify(data));
            dbOrders = data;
            showToast(`✅ ${data.length} orders imported successfully`, 'success');
          }

          loadStats();
        } catch (err) {
          showToast('Error reading file: ' + err.message, 'error');
        }
      };
      
      reader.readAsText(file);
      input.value = ''; // Reset file input
    }
  </script>
</body>
</html>
