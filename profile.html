<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - 4A Store</title>
  <meta name="description" content="4A Store - Manage your profile and account settings.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .profile-container { max-width:500px; margin:30px auto; padding:0 20px; }
    .profile-card { background:white; border-radius:16px; box-shadow:var(--shadow-lg); overflow:hidden; }
    .profile-header { background:linear-gradient(135deg, var(--primary), var(--secondary)); padding:30px 24px; text-align:center; color:white; }
    .profile-header .avatar { width:80px; height:80px; background:rgba(255,255,255,0.2); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:2.5rem; margin:0 auto 12px; border:3px solid rgba(255,255,255,0.5); }
    .profile-header h2 { font-size:1.3rem; margin-bottom:4px; }
    .profile-header p { font-size:13px; opacity:0.9; }
    .profile-body { padding:24px; }
    .profile-info { margin-bottom:20px; }
    .profile-info .info-row { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border); font-size:14px; }
    .profile-info .info-row .label { color:var(--gray); }
    .profile-info .info-row .value { font-weight:600; color:#333; }
    .profile-actions { display:flex; flex-direction:column; gap:10px; }
    .profile-actions a, .profile-actions button { display:flex; align-items:center; gap:10px; padding:14px 18px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; transition:var(--transition); text-decoration:none; border:none; width:100%; text-align:left; }
    .profile-actions .action-orders { background:var(--primary-light); color:var(--primary-dark); }
    .profile-actions .action-orders:hover { background:var(--primary); color:white; }
    .profile-actions .action-cart { background:#e3f2fd; color:#1565c0; }
    .profile-actions .action-cart:hover { background:#1565c0; color:white; }
    .profile-actions .action-address { background:#f3e5f5; color:#6a1b9a; }
    .profile-actions .action-address:hover { background:#6a1b9a; color:white; }
    .profile-actions .action-logout { background:#ffebee; color:#c62828; }
    .profile-actions .action-logout:hover { background:#c62828; color:white; }
    .profile-actions .action-delete { background:#fff3e0; color:#a34b00; }
    .profile-actions .action-delete:hover { background:#a34b00; color:white; }
    .profile-support { margin-top:6px; padding-top:16px; border-top:1px solid var(--border); }
    .profile-support h3 { margin:0 0 8px; font-size:13px; color:var(--dark); }
    .profile-support-links { display:grid; gap:8px; }
    .profile-support-links a { display:flex; align-items:center; justify-content:space-between; padding:11px 12px; border-radius:9px; background:var(--light-gray); color:var(--dark); font-size:12px; font-weight:600; text-decoration:none; }
    .profile-support-links a:hover { background:var(--primary-light); color:var(--primary-dark); }
    .profile-stats { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-bottom:20px; }
    .profile-stats .stat { text-align:center; padding:12px; background:var(--light-gray); border-radius:10px; }
    .profile-stats .stat .num { font-size:1.3rem; font-weight:800; color:var(--primary-dark); }
    .profile-stats .stat .lbl { font-size:11px; color:var(--gray); margin-top:2px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="location-text">📍 Delivering in Chandargarh – 824301 | ☎️ 8210874123</div>
  </div>

  <header class="main-header">
    <div class="header-content">
      <a href="./" class="logo"><img src="assets/images/logo.svg" alt="4A Store" height="52"></a>
      <form class="search-box" onsubmit="handleSearch(event)">
        <input type="text" placeholder="Search for groceries..." id="searchInput">
        <button type="submit">🔍</button>
      </form>
      <div class="header-actions">
        <div class="login-btn-area"></div>
        <a href="cart.html" class="cart-badge">🛒 <span class="action-text">Cart</span>
          <span class="badge cart-count" style="display:none">0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="profile-container">
    <div class="profile-card" id="profileCard">
      <!-- Populated by JS -->
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-grid">
      <div class="footer-col"><h4>About 4astore</h4><p>Your local online grocery store serving Chandargarh and nearby areas.</p></div>
      <div class="footer-col"><h4>Contact</h4><p class="store-phone"><a href="tel:8210874123">📞 8210874123</a></p></div>
    </div>
    <div class="footer-bottom">© 2026 4astore. All Rights Reserved.</div>
  </footer>

  <nav class="bottom-nav">
    <div class="nav-items">
      <a href="./" class="nav-item"><span class="nav-icon">🏠</span>Home</a>
      <a href="products" class="nav-item"><span class="nav-icon">📂</span>Categories</a>
      <a href="cart.html" class="nav-item"><span class="nav-icon">🛒</span>Cart<span class="mobile-badge cart-count" style="display:none">0</span></a>
      <a href="profile" class="nav-item active"><span class="nav-icon">👤</span>Profile</a>
    </div>
  </nav>

  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!await requireLogin()) return;
      const user = getLoggedInUser();
      renderProfile(user);
      loadRecoveryEmail();
    });

    let pendingRecoveryEmail = '';

    async function loadRecoveryEmail() {
      try {
        const response = await fetch('api/password-recovery.php?action=profileEmail', { credentials: 'include', cache: 'no-store' });
        const result = await response.json();
        if (!result.success) return;
        const emailInput = document.getElementById('recoveryEmail');
        emailInput.value = result.email || '';
        emailInput.readOnly = false;
        document.querySelector('button[onclick="sendRecoveryEmailCode()"]').textContent = result.verified ? 'Update recovery email' : 'Send verification code';
        document.getElementById('recoveryEmailStatus').textContent = result.verified ? '✅ Current recovery email verified. A new email replaces it only after OTP verification.' : 'No verified recovery email yet.';
        document.getElementById('recoveryEmailStatus').style.color = result.verified ? '#087a3d' : 'var(--gray)';
      } catch (error) {
        document.getElementById('recoveryEmailStatus').textContent = 'Could not load recovery email status.';
      }
    }

    async function sendRecoveryEmailCode() {
      const email = document.getElementById('recoveryEmail').value.trim().toLowerCase();
      const status = document.getElementById('recoveryEmailStatus');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        status.textContent = 'Enter a valid email address.';
        status.style.color = '#b42318';
        return;
      }
      status.textContent = 'Sending verification code...';
      status.style.color = 'var(--gray)';
      try {
        const response = await fetch('api/password-recovery.php', {
          method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'sendProfileEmailCode', email })
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'Could not send code.');
        if (result.alreadyVerified) {
          status.textContent = '✅ This recovery email is already verified.';
          status.style.color = '#087a3d';
          document.getElementById('recoveryEmailCodeRow').style.display = 'none';
          return;
        }
        pendingRecoveryEmail = email;
        document.getElementById('recoveryEmailCodeRow').style.display = 'block';
        status.textContent = 'Code sent. Check your inbox and spam folder.';
        status.style.color = '#087a3d';
        document.getElementById('recoveryEmailCode').focus();
      } catch (error) {
        status.textContent = error.message || 'Could not send code. Try again.';
        status.style.color = '#b42318';
      }
    }

    async function verifyRecoveryEmailCode() {
      const status = document.getElementById('recoveryEmailStatus');
      const email = document.getElementById('recoveryEmail').value.trim().toLowerCase();
      const otp = document.getElementById('recoveryEmailCode').value.trim();
      if (!pendingRecoveryEmail || email !== pendingRecoveryEmail) {
        status.textContent = 'Email changed. Send a new verification code.';
        status.style.color = '#b42318';
        return;
      }
      try {
        const response = await fetch('api/password-recovery.php', {
          method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'verifyProfileEmailCode', otp })
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'Code verification failed.');
        pendingRecoveryEmail = '';
        document.getElementById('recoveryEmailCodeRow').style.display = 'none';
        document.getElementById('recoveryEmailCode').value = '';
        status.textContent = '✅ Recovery email verified and saved.';
        status.style.color = '#087a3d';
        await loadRecoveryEmail();
      } catch (error) {
        status.textContent = error.message || 'Code verification failed.';
        status.style.color = '#b42318';
      }
    }

    function renderProfile(user) {
      const orders = getOrders();
      const userOrders = orders.filter(o => o.customer.mobile === user.mobile);
      const totalSpent = userOrders.reduce((s, o) => s + o.totalAmount, 0);
      const cartCount = getCartCount();

      document.getElementById('profileCard').innerHTML = `
        <div class="profile-header">
          <div class="avatar">👤</div>
          <h2>${user.name}</h2>
          <p>@${user.username || user.mobile}</p>
        </div>
        <div class="profile-body">
          <!-- Stats -->
          <div class="profile-stats">
            <div class="stat">
              <div class="num">${userOrders.length}</div>
              <div class="lbl">Orders</div>
            </div>
            <div class="stat">
              <div class="num">₹${totalSpent}</div>
              <div class="lbl">Total Spent</div>
            </div>
            <div class="stat">
              <div class="num">${cartCount}</div>
              <div class="lbl">In Cart</div>
            </div>
          </div>

          <!-- Info -->
          <div class="profile-info">
            <div class="info-row">
              <span class="label">👤 Name</span>
              <span class="value">${user.name}</span>
            </div>
            <div class="info-row">
              <span class="label">📱 Mobile</span>
              <span class="value">${user.mobile}</span>
            </div>
            <div class="info-row">
              <span class="label">🆔 Username</span>
              <span class="value">${user.username || '-'}</span>
            </div>
            <div class="info-row">
              <span class="label">📅 Member Since</span>
              <span class="value">${user.loggedInAt ? new Date(user.loggedInAt).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}) : '-'}</span>
            </div>
          </div>

          <section style="margin:0 0 20px;padding:16px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);text-align:left;">
            <h3 style="margin:0 0 5px;font-size:15px;color:var(--dark);">Password recovery email</h3>
            <p style="margin:0 0 12px;font-size:12px;color:var(--gray);">Verify an email address to receive password reset codes.</p>
            <label for="recoveryEmail" style="display:block;margin-bottom:5px;font-size:13px;font-weight:700;">Email address</label>
            <input id="recoveryEmail" type="email" autocomplete="email" placeholder="you@example.com" style="width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font:inherit;">
            <div style="display:flex;gap:8px;margin-top:9px;">
              <button type="button" onclick="sendRecoveryEmailCode()" style="flex:1;min-height:42px;padding:9px 12px;border:0;border-radius:8px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer;">Send verification code</button>
            </div>
            <p id="recoveryEmailStatus" role="status" aria-live="polite" style="min-height:18px;margin:8px 0 0;font-size:12px;color:var(--gray);"></p>
            <div id="recoveryEmailCodeRow" style="display:none;margin-top:8px;">
              <label for="recoveryEmailCode" style="display:block;margin-bottom:5px;font-size:13px;font-weight:700;">6-digit email code</label>
              <div style="display:flex;gap:8px;">
                <input id="recoveryEmailCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="flex:1;min-width:0;min-height:42px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font:inherit;letter-spacing:2px;">
                <button type="button" onclick="verifyRecoveryEmailCode()" style="min-height:42px;padding:9px 12px;border:0;border-radius:8px;background:#087a3d;color:#fff;font-weight:700;cursor:pointer;">Verify</button>
              </div>
            </div>
          </section>

          <!-- Actions -->
          <div class="profile-actions">
            <a href="order-history" class="action-orders">📦 My Orders <span style="margin-left:auto; font-size:12px;">${userOrders.length} orders →</span></a>
            <a href="cart.html" class="action-cart">🛒 My Cart <span style="margin-left:auto; font-size:12px;">${cartCount} items →</span></a>
            <a href="checkout.html" class="action-address">🏠 Delivery Address</a>
            ${isAdminUser(user) ? '<a href="admin" class="action-admin" style="background:#2C6FAD;color:white;">🔐 Admin Panel →</a>' : ''}
            <button class="action-logout" onclick="handleLogout()">🚪 Logout</button>
            <button class="action-delete" onclick="deleteMyAccount()">🗑️ Delete my account</button>
            <div class="profile-support">
              <h3>Help &amp; Legal</h3>
              <div class="profile-support-links">
                <a href="help-support.html">Help &amp; Support <span>›</span></a>
                <a href="privacy-policy.html">Privacy Policy <span>›</span></a>
                <a href="terms.html">Terms &amp; Conditions <span>›</span></a>
                <a href="account-deletion.html">Account Deletion <span>›</span></a>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    async function handleLogout() {
      const confirmed = await showAppConfirm('Are you sure you want to logout?', {
        title: 'Log out?', confirmText: 'Log out'
      });
      if (confirmed) logoutUser();
    }

    async function deleteMyAccount() {
      const confirmed = await showAppConfirm('Your account details will be removed. Existing order records may be retained for legal and store records.', {
        title: 'Delete your account?', confirmText: 'Delete account', danger: true
      });
      if (!confirmed) return;
      const xhr = new XMLHttpRequest();
      xhr.open('POST', 'api/users.php', false);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.send(JSON.stringify({ action: 'deleteSelf' }));
      let response = null;
      try { response = JSON.parse(xhr.responseText || '{}'); } catch (e) { response = null; }
      if (!response || !response.success) {
        showToast((response && response.message) || 'Unable to delete account. Please contact support.', 'error');
        return;
      }
      const user = getLoggedInUser();
      const cartKey = typeof getCartStorageKey === 'function' ? getCartStorageKey(user) : '4astore_cart';
      ['4astore_user', '4astore_customer', cartKey, '4astore_cart_guest', '4astore_cart', '4astore_orders'].forEach(key => localStorage.removeItem(key));
      showAppToast('Your account has been deleted.', 'success');
      setTimeout(() => { window.location.href = 'account-deletion'; }, 900);
    }

    function isAdminUser(user) {
      // Check if user mobile is in admin authorized list
      const adminData = JSON.parse(localStorage.getItem('4astore_admin'));
      if (!adminData) return false;
      const authorizedMobiles = adminData.authorizedMobiles || [];
      // Super admin mobile + authorized list
      return user.mobile === adminData.mobile || authorizedMobiles.includes(user.mobile);
    }
  </script>
</body>
</html>
